[project]
name = "pla-agent"
version = "0.1.0"
description = "Agent for PLA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "langchain-google-genai>=4.4.1",
    "langgraph>=1.2.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
